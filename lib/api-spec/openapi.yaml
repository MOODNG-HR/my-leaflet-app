openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries
  - name: employees
    description: Employee directory and leave balances
  - name: admin-employees
    description: Administrator employee lifecycle management
  - name: leave-requests
    description: Annual leave request workflows
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get leave management dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /employees:
    get:
      operationId: getEmployees
      tags: [employees]
      summary: List company employees with current leave balances (administrator only)
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
        "403":
          description: Administrator access required
  /me/employee:
    get:
      operationId: getMyEmployee
      tags: [employees]
      summary: Get the signed-in employee profile
      responses:
        "200":
          description: Employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          description: Authentication required
        "404":
          description: Employee profile not registered
    post:
      operationId: registerMyEmployee
      tags: [employees]
      summary: Register the signed-in employee profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRegistrationInput"
      responses:
        "201":
          description: Registered employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          description: Authentication required
  /employees/{id}/balance:
    get:
      operationId: getEmployeeBalance
      tags: [employees]
      summary: Get an employee's leave balance
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Leave balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveBalance"
        "404":
          description: Employee not found
  /admin/employees:
    get:
      operationId: getAdminEmployees
      tags: [admin-employees]
      summary: List employees managed by the signed-in administrator
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
        "403":
          description: Administrator access required
    post:
      operationId: createAdminEmployee
      tags: [admin-employees]
      summary: Pre-register an employee account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmployeeInput"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "409":
          description: Email or employee number already registered
  /admin/employees/{id}:
    get:
      operationId: getAdminEmployee
      tags: [admin-employees]
      summary: Get a managed employee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
    patch:
      operationId: updateAdminEmployee
      tags: [admin-employees]
      summary: Update a managed employee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmployeeUpdateInput"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
        "409":
          description: Email or employee number already registered
  /admin/employees/{id}/resign:
    post:
      operationId: resignAdminEmployee
      tags: [admin-employees]
      summary: Mark a managed employee as resigned
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResignEmployeeInput"
      responses:
        "200":
          description: Employee marked as resigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
  /leave-requests:
    get:
      operationId: getLeaveRequests
      tags: [leave-requests]
      summary: List leave requests
      parameters:
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/EmployeeIdQuery"
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
    post:
      operationId: createLeaveRequest
      tags: [leave-requests]
      summary: Submit an annual leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestInput"
      responses:
        "201":
          description: Created leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Invalid request
  /attendance/records:
    post:
      operationId: createAttendanceRecord
      tags: [leave-requests]
      summary: Register an employee attendance record as an administrator
      requestBody:
        required: true
        content:
          application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecordInput"
      responses:
        "201":
          description: Registered attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Invalid request
  /leave-requests/{id}:
    get:
      operationId: getLeaveRequest
      tags: [leave-requests]
      summary: Get a leave request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "404":
          description: Leave request not found
  /leave-requests/{id}/status:
    patch:
      operationId: updateLeaveRequestStatus
      tags: [leave-requests]
      summary: Approve or reject a leave request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestStatusInput"
      responses:
        "200":
          description: Updated leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "404":
          description: Leave request not found
components:
  parameters:
    EmployeeId:
      name: id
      in: path
      required: true
      schema:
        type: number
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: number
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/LeaveRequestStatus"
    Year:
      name: year
      in: query
      required: false
      schema:
        type: number
    Month:
      name: month
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        maximum: 12
    EmployeeIdQuery:
      name: employeeId
      in: query
      required: false
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Employee:
      type: object
      required: [id, name, department, position, role, joinedAt, status, ordinaryHourlyWage, annualAllowance, usedDays, pendingDays, remainingDays]
      properties:
        id:
          type: number
        name:
          type: string
        department:
          type: string
        role:
          type: string
        joinedAt:
          type: string
          format: date
        annualAllowance:
          type: number
        usedDays:
          type: number
        pendingDays:
          type: number
        remainingDays:
          type: number
        companyName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        employeeNumber:
          type: ["string", "null"]
        position:
          type: string
        status:
          type: string
          enum: [active, resigned]
        resignedAt:
          type: ["string", "null"]
          format: date
        ordinaryHourlyWage:
          type: number
    EmployeeRegistrationInput:
      type: object
      required: [companyName, name, email]
      properties:
        companyName:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
    AdminEmployeeInput:
      type: object
      required: [employeeNumber, name, email, department, position, role, joinedAt, ordinaryHourlyWage]
      properties:
        employeeNumber:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        department:
          type: string
          minLength: 1
        position:
          type: string
        role:
          type: string
          enum: [직원, 관리자]
        joinedAt:
          type: string
          format: date
        ordinaryHourlyWage:
          type: number
          minimum: 0
    AdminEmployeeUpdateInput:
      type: object
      properties:
        employeeNumber:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        department:
          type: string
          minLength: 1
        position:
          type: string
        role:
          type: string
          enum: [직원, 관리자]
        joinedAt:
          type: string
          format: date
        ordinaryHourlyWage:
          type: number
          minimum: 0
    ResignEmployeeInput:
      type: object
      required: [resignedAt]
      properties:
        resignedAt:
          type: string
          format: date
    LeaveBalance:
      type: object
      required: [employeeId, annualAllowance, usedDays, pendingDays, remainingDays]
      properties:
        employeeId:
          type: number
        annualAllowance:
          type: number
        usedDays:
          type: number
        pendingDays:
          type: number
        remainingDays:
          type: number
    LeaveRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    LeaveType:
      type: string
      enum: [annual, half_day, quarter_day, early_leave, outing, wedding_funeral, paid_leave, public_leave, sick_leave, substitute, absence, attendance_other, sabbatical]
    TimeSlot:
      type: string
      enum: [start, end]
    LeaveRequest:
      type: object
      required: [id, employeeId, employeeName, department, leaveType, startDate, endDate, days, reason, status, createdAt, recordSource]
      properties:
        id:
          type: number
        employeeId:
          type: number
        employeeName:
          type: string
        department:
          type: string
        leaveType:
          $ref: "#/components/schemas/LeaveType"
        timeSlot:
          type: ["string", "null"]
          enum: [start, end, null]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        days:
          type: number
        reason:
          type: string
        status:
          $ref: "#/components/schemas/LeaveRequestStatus"
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: ["string", "null"]
          format: date-time
        rejectionReason:
          type: ["string", "null"]
        recordSource:
          type: string
          enum: [employee_request, admin_attendance]
        registeredByEmployeeId:
          type: ["number", "null"]
        registeredByName:
          type: ["string", "null"]
    LeaveRequestInput:
      type: object
      required: [employeeId, leaveType, startDate, endDate, days, reason]
      properties:
        employeeId:
          type: number
        leaveType:
          $ref: "#/components/schemas/LeaveType"
        timeSlot:
          type: ["string", "null"]
          enum: [start, end, null]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        days:
          type: number
          minimum: 0.25
        reason:
          type: string
          minLength: 1
    AttendanceRecordType:
      type: string
      enum: [annual, public_leave, sick_leave, absence, attendance_other]
    AttendanceRecordInput:
      type: object
      required: [employeeId, attendanceType, startDate, endDate, days, reason]
      properties:
        employeeId:
          type: number
        attendanceType:
          $ref: "#/components/schemas/AttendanceRecordType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        days:
          type: number
          minimum: 0.5
        reason:
          type: string
          minLength: 1
    LeaveRequestStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/LeaveRequestStatus"
        rejectionReason:
          type: ["string", "null"]
    UpcomingLeave:
      type: object
      required: [id, employeeName, leaveType, startDate, endDate, days]
      properties:
        id:
          type: number
        employeeName:
          type: string
        leaveType:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        days:
          type: number
    MonthlyLeaveUsage:
      type: object
      required: [month, days]
      properties:
        month:
          type: string
        days:
          type: number
    DashboardSummary:
      type: object
      required: [year, annualAllowance, usedDays, remainingDays, pendingDays, employeeCount, pendingRequestCount, approvedRequestCount, upcomingLeaves, monthlyUsage]
      properties:
        year:
          type: number
        annualAllowance:
          type: number
        usedDays:
          type: number
        remainingDays:
          type: number
        pendingDays:
          type: number
        employeeCount:
          type: number
        pendingRequestCount:
          type: number
        approvedRequestCount:
          type: number
        upcomingLeaves:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingLeave"
        monthlyUsage:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyLeaveUsage"

